document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"83a7c628-c3d6-4c75-a37f-2f87d838500b\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; background: #08080a; }\n  * { box-sizing: border-box; }\n  body { -webkit-font-smoothing: antialiased; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }\n  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 320px 0; } }\n  @keyframes slideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  @keyframes slideLeft { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }\n  textarea, input, button { font: inherit; color: inherit; }\n  ::selection { background: rgba(255,255,255,.16); }\n  a { color: #a8c7e8; text-decoration: none; }\n  a:hover { color: #cfe0f2; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #08080a; padding: 22px 22px 44px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif; color: #f2f2f3;\">\n\n  <div style=\"width: 1440px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <div style=\"font-size: 12px; letter-spacing: .14em; color: #63636a; text-transform: uppercase;\">TGBUDDY · 交互原型<\u002Fdiv>\n      <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n        <sc-for list=\"{{ scenes }}\" as=\"s\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ s.go }}\" style=\"padding: 7px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; transition: background .15s, color .15s; background: {{ s.bg }}; color: {{ s.fg }};\" style-hover=\"filter: brightness(1.25)\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 8px;\">\n      <button sc-camel-on-click=\"{{ toggleDecisions }}\" style=\"padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: #d9d9dd; cursor: pointer; font-size: 13px;\" style-hover=\"background: rgba(255,255,255,.06)\">决策说明<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width: 1440px; display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(127,167,212,.07); color: #a9c4de; font-size: 12.5px; line-height: 1.55;\">\n    <span style=\"flex: none; opacity: .7;\">◆<\u002Fspan>\n    <span>{{ sceneNote }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"主窗口\" style=\"width: 1440px; height: 900px; border-radius: 12px; overflow: hidden; background: #141415; box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); display: flex; position: relative;\">\n\n    <!-- 侧边栏 -->\n    <div data-screen-label=\"侧边栏 会话列表\" style=\"width: 252px; flex: none; background: #0e0e0f; display: flex; flex-direction: column; padding: 12px 10px; gap: 10px; position: relative;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; padding: 4px 4px 0;\">\n        <div style=\"width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(145deg,#f4f4f5,#b9b9bd); display: flex; align-items: center; justify-content: center; color: #17171a; font-size: 12px; font-weight: 600;\">P<\u002Fdiv>\n        <div style=\"font-size: 13.5px; font-weight: 600; letter-spacing: .02em;\">TgBuddy<\u002Fdiv>\n        <div style=\"margin-left: auto; display: flex; gap: 2px;\">\n          <button sc-camel-on-click=\"{{ openSettings }}\" style=\"width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent; color: #7d7d84; cursor: pointer; display: flex; align-items: center; justify-content: center;\" style-hover=\"background: rgba(255,255,255,.07); color: #e6e6e9\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 8 3h.1A1.7 1.7 0 0 0 9 1.4V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 8v.1a1.7 1.7 0 0 0 1.6 1H23a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.9z\" transform=\"scale(.85) translate(2,2)\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: relative;\">\n        <button sc-camel-on-click=\"{{ toggleWs }}\" style=\"width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: none; background: {{ wsChipBg }}; color: #dcdce1; cursor: pointer; text-align: left;\" style-hover=\"filter: brightness(1.3)\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8fb0d2\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex: none;\"><path d=\"M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>\n          <div style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;\">\n            <div style=\"font-size: 12.5px; color: #e8e8ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ wsName }}<\u002Fdiv>\n            <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #6d6d75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ wsPath }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"flex: none; font-size: 10px; color: #6c6c74;\">▾<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ wsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position: absolute; left: 0; right: -8px; top: calc(100% + 6px); padding: 6px; border-radius: 11px; background: #1c1c1f; box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08); z-index: 45; display: flex; flex-direction: column; gap: 2px; animation: slideUp .16s ease-out;\">\n            <div style=\"padding: 6px 9px 7px; font-size: 11px; letter-spacing: .06em; color: #6d6d75;\">工作区<\u002Fdiv>\n            <sc-for list=\"{{ workspaces }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ w.pick }}\" style=\"display: flex; gap: 9px; padding: 8px 9px; border-radius: 8px; cursor: pointer; background: {{ w.bg }};\" style-hover=\"background: rgba(255,255,255,.07)\">\n                <span style=\"width: 13px; flex: none; text-align: center; font-size: 12px; color: #9dbfe0;\">{{ w.mark }}<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;\">\n                  <div style=\"font-size: 12.5px; color: #e2e2e7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ w.name }}<\u002Fdiv>\n                  <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #75757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ w.path }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"flex: none; align-self: center; font-size: 10.5px; color: #66666e;\">{{ w.meta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin: 4px 4px 2px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 6px;\">\n              <button sc-camel-on-click=\"{{ toggleWs }}\" style=\"display: flex; align-items: center; gap: 7px; padding: 6px 6px; border-radius: 7px; border: none; background: transparent; color: #cfe0f2; font-size: 12px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.06)\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>选择其他文件夹…\n              <\u002Fbutton>\n              <div style=\"padding: 0 6px 4px; font-size: 11px; color: #5f5f66; line-height: 1.65;\">会话、产物和「总是允许」规则都按工作区隔离。Agent 的读写默认不出这个目录。<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <button style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; border: 1px dashed rgba(255,255,255,.17); background: transparent; color: #d5d5d9; cursor: pointer; font-size: 13px; text-align: left;\" style-hover=\"border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.03)\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n        新建会话\n        <span style=\"margin-left: auto; font-size: 11px; color: #63636a;\">⌘N<\u002Fspan>\n      <\u002Fbutton>\n\n      <div style=\"display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 9px; background: #17171a; color: #6f6f75;\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"搜索会话与产物\" style=\"flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 12.5px; color: #e6e6e9;\">\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasSessions }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -2px;\">\n          <sc-for list=\"{{ sessionGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px; margin-top: 10px;\">\n              <div style=\"display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 11px; letter-spacing: .08em; color: #5a5a61;\">{{ g.title }}<\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ it.pick }}\" sc-camel-on-context-menu=\"{{ it.menu }}\" style=\"position: relative; display: flex; flex-direction: column; gap: 3px; padding: 8px 9px; border-radius: 9px; cursor: pointer; background: {{ it.bg }};\" style-hover=\"background: rgba(255,255,255,.055)\">\n                  <div style=\"display: flex; align-items: center; gap: 6px;\">\n                    <sc-if value=\"{{ it.streaming }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #7fa7d4; animation: pulse 1.1s ease-in-out infinite; flex: none;\"><\u002Fspan>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ it.pinned }}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8a8a92\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex: none;\"><path d=\"M12 17v5M9 10.8V4h6v6.8l2 3.2H7z\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fsc-if>\n                    <div style=\"font-size: 13px; color: #e8e8ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ it.title }}<\u002Fdiv>\n                    <div style=\"margin-left: auto; font-size: 10.5px; color: #55555c; flex: none;\">{{ it.time }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #6d6d74;\">\n                    <span style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ it.sub }}<\u002Fspan>\n                    <sc-if value=\"{{ it.artifacts }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"flex: none; display: flex; align-items: center; gap: 3px; color: #7d7d85;\">\n                        <svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M5 3h9l5 5v13H5z\"><\u002Fpath><\u002Fsvg>{{ it.artifacts }}\n                      <\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"height: 20px; flex: none;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noSessions }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 14px;\">\n          <div style=\"font-size: 12.5px; color: #55555c; line-height: 1.7;\">还没有会话。<br>每个任务一个会话，产物自动收纳。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ ctxMenu }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: absolute; left: 168px; top: 268px; width: 196px; padding: 5px; border-radius: 10px; background: #1c1c1f; box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); z-index: 40; animation: slideUp .16s ease-out;\">\n          <sc-for list=\"{{ ctxMenuItems }}\" as=\"m\" h Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin: 4px 5px 2px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.07); display: flex;\">\n                <button sc-camel-on-click=\"{{ openSettings }}\" style=\"padding: 4px 8px; border-radius: 6px; border: none; background: transparent; color: #8fb0d2; font-size: 11.5px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.06)\">在设置中管理…<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 结果区 -->\n    <sc-if value=\"{{ resultsOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"结果区 产物\" style=\"width: 356px; flex: none; background: #0e0e0f; display: flex; flex-direction: column; animation: slideLeft .2s ease-out;\">\n        <div style=\"height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;\">\n          <span style=\"font-size: 13px; font-weight: 550; color: #ececf0;\">结果区<\u002Fspan>\n          <span style=\"font-size: 11px; color: #5f5f67;\">{{ resultCount }}<\u002Fspan>\n          <div style=\"margin-left: auto; display: flex; gap: 4px;\">\n            <button style=\"width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent; color: #7d7d85; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.07); color: #e6e6e9\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M4 6h16M7 12h10M10 18h4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex: 1; min-height: 0; display: flex; flex-direction: column;\">\n            <div style=\"flex: none; padding: 0 14px 10px; display: f             <div style=\"color: #666;\">交互式 HTML 在沙箱 webview 中渲染，脚本默认禁用。<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 6px; padding: 9px 11px; background: rgba(255,255,255,.02);\">\n                <button style=\"padding: 5px 10px; border-radius: 7px; border: none; background: rgba(255,255,255,.07); color: #dcdce1; font-size: 11.5px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.13)\">打开<\u002Fbutton>\n                <button style=\"padding: 5px 10px; border-radius: 7px; border: none; background: rgba(255,255,255,.07); color: #dcdce1; font-size: 11.5px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.13)\">复制<\u002Fbutton>\n                <button style=\"padding: 5px 10px; border-radius: 7px; border: none; background: transparent; color: #9a9aa2; font-size: 11.5px; cursor: pointer;\" style-hover=\"color: #e6e6ea\">另存为…<\u002Fbutton>\n                <button style=\"margin-left: auto; padding: 5px 10px; border-radius: 7px; border: none; background: transparent; color: #8fb0d2; font-size: 11.5px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.06)\">让 Agent 改这份<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex: 1; min-height: 0; overflow: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 2px;\">\n              <sc-for list=\"{{ resultGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px;\">\n                  <div style=\"padding: 6px 4px; font-size: 11px; letter-spacing: .07em; color: #5a5a61;\">{{ g.title }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ r.pick }}\" style=\"display: flex; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; background: {{ r.bg }};\" style-hover=\"background: rgba(255,255,255,.055)\">\n                      <span style=\"width: 24px; height: 24px; flex: none; border-radius: 7px; background: {{ r.iconBg }}; color: {{ r.iconFg }}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: ui-monospace, Menlo, monospace;\">{{ r.ext }}<\u002Fspan>\n                      <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;\">\n                        <div style=\"font-size: 12.5px; color: #e4e4e9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ r.name }}<\u002Fdiv>\n                        <div style=\"font-size: 11px; color: #6d6d75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ r.sub }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ r.fresh }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"flex: none; align-self: center; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(95,169,124,.16); color: #8fc6a5;\">新<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding: 10px 4px 0; font-size: 11px; color: #55555c; line-height: 1.7;\">按产生时间倒序，类型只做筛选不做分组——同一次任务的产物通常一起被查看。<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- 结果区空状态 -->\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex: 1; display: flex; flex-direction: column; padding: 6px 16px 20px; gap: 16px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 7px; padding: 14px; border-radius: 12px; background: #141416; box-shadow: inset 0 0 0 1px rgba(255,255,255,.045);\">\n              <div style=\"width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.05); display: flex; align-items: center; justify-content: center; color: #8a8a92;\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M5 3h9l5 5v13H5z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; color: #e0e0e5; font-weight: 500;\">这次任务的产物会出现在这里<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #7d7d85; line-height: 1.75;\">左边是 Agent 的<b style=\"color: #a6a6ad; font-weight: 500;\">过程<\u002Fb>——几十次工具调用会滚过去。这里只留<b style=\"color: #a6a6ad; font-weight: 500;\">结果<\u002Fb>：它写出的文件、生成的图、改动过的代码。<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <div style=\"font-size: 11px; letter-spacing: .07em; color: #5a5a61; padding-left: 2px;\">会自动收纳<\u002Fdiv>\n              <sc-for list=\"{{ emptyHints }}\" as=\"h\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 9px; background: rgba(255,255,255,.018);\">\n                  <span style=\"width: 24px; height: 24px; flex: none; border-radius: 7px; background: rgba(255,255,255,.04); color: #6d6d75; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: ui-monospace, Menlo, monospace;\">{{ h.ext }}<\u002Fspan>\n                  <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n                    <div style=\"font-size: 12px; color: #9a9aa2;\">{{ h.label }}<\u002Fdiv>\n                    <div style=\"font-size: 11px; color: #5f5f67;\">{{ h.desc }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top: auto; padding: 11px 12px; border-radius: 10px; background: rgba(127,167,212,.06); font-size: 11.5px; color: #8ba7c4; line-height: 1.7;\">你也可以让 Agent 把中间发现「钉」到这里：在对话里说「把这段结论存成文件」。<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- 模态权限（高危升级） -->\n    <sc-if value=\"{{ permModal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(6,6,8,.62); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 60; animation: slideUp .15s ease-out;\">\n        <div data-screen-label=\"权限确认 模态\" style=\"width: 520px; border-radius: 14px; background: #1e1e21; box-shadow: 0 32px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08); padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <div style=\"width: 30px; height: 30px; border-radius: 9px; background: rgba(201,99,91,.16); color: #e5a49d; display: flex; align-items: center; justify-content: center;\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><path d=\"M10.3 3.9 2.5 17.5A1.7 1.7 0 0 0 4 20h16a1.7 1.7 0 0 0 1.5-2.5L13.7 3.9a1.7 1.7 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n              <div style=\"font-size: 15px; font-weight: 550; color: #f2f2f4;\">确认删除 3 个文件？<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #8a8a92;\">高危 · 不可逆 · 无回收站<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ closePermModal }}\" style=\"margin-left: auto; width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent; color: #7d7d85; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.07)\">✕<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding: 11px 13px; border-radius: 9px; background: #141416; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: #cfcfd6; line-height: 1.8;\">$ rm -rf ~/project/tmp/cache<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #9a9aa2; line-height: 1.7;\">\n            <div>· 3 个文件 · 128 MB · 均未被 git 跟踪<\u002Fdiv>\n            <div>· 由「风险分析专家」在计划第 3 步发起<\u002Fdiv>\n            <div>· 该命令含 rm，永远不能进入「总是允许」<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center;\">\n            <button sc-camel-on-click=\"{{ closePermModal }}\" style=\"padding: 8px 15px; border-radius: 8px; border: none; background: #c9635b; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;\" style-hover=\"filter: brightness(1.1)\">允许删除<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ closePermModal }}\" style=\"padding: 8px 14px; border-radius: 8px; border: none; background: rgba(255,255,255,.08); color: #e6e6ea; font-size: 13px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.14)\">拒绝并说明<\u002Fbutton>\n            <span style=\"margin-left: auto; font-size: 11px; color: #75757e;\">模态只用于高危+不可逆<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- 设置：技能与工具 -->\n    <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(6,6,8,.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 55;\">\n        <div data-screen-label=\"设置 技能与工具\" style=\"width: 900px; height: 660px; border-radius: 14px; background: #1e1e21; box-shadow: 0 32px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08); display: flex; overflow: hidden;\">\n          <div style=\"width: 178px; flex: none; background: rgba(0,0,0,.18); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px;\">\n            <div style=\"padding: 4px 10px 12px; font-size: 13px; font-weight: 550; color: #ececf0;\">设置<\u002Fdiv>\n            <sc-for list=\"{{ settingsNav }}\" as=\"n\" hint-placeholder-count=\"7\">\n              <div sc-camel-on-click=\"{{ n.pick }}\" style=\"display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; color: {{ n.fg }}; background: {{ n.bg }}; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.05)\">\n                <span style=\"flex: 1;\">{{ n.label }}<\u002Fspan>\n                <sc-if value=\"{{ n.badge }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"flex: none; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: {{ n.badgeBg }}; color: {{ n.badgeFg }};\">{{ n.badge }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n            <div style=\"flex: none; padding: 18px 22px 14px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px;\">\n                <div style=\"font-size: 15px; font-weight: 550; color: #f2f2f4;\">{{ setTitle }}<\u002Fdiv>\n                <sc-if value=\"{{ setAction }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button style=\"margin-left: auto; padding: 5px 11px; border-radius: 8px; border: none; background: rgba(255,255,255,.08); color: #e4e4e8; font-size: 12px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.14)\">{{ setAction }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ closeSettings }}\" style=\"width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent; color: #7d7d85; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.07)\">✕<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size: 12.5px; color: #85858e; line-height: 1.75;\">{{ setSub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-height: 0; overflow: auto; padding: 0 22px 20px; display: flex; flex-direction: column; gap: 10px;\">\n\n              <!-- 工具 -->\n              <sc-if value=\"{{ isTools }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                  <div style=\"display: flex; align-items: center; gap: 9px; padding: 0 2px;\">\n                    <span style=\"font-size: 11px; letter-spacing: .06em; color: #6d6d75;\">内置工具 {{ toolCount }}<\u002Fspan>\n                    <div style=\"flex: 1; height: 1px; background: rgba(255,255,255,.07);\"><\u002Fdiv>\n                    <sc-for list=\"{{ bulkPerms }}\" as=\"b\" hint-placeholder-count=\"2\">\n                      <button sc-camel-on-click=\"{{ b.act }}\" style=\"padding: 4px 9px; border-radius: 6px; border: none; background: rgba(255,255,255,.06); color: #b6b6be; font-size: 11px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.12)\">{{ b.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ builtinTools }}\" as=\"t\" hint-placeholder-count=\"6\">\n                    <div style=\"display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 10px; background: #17171a;\">\n                      <span style=\"width: 26px; height: 26px; flex: none; border-radius: 7px; background: rgba(127,167,212,.12); color: #9dbfe0; display: flex; align-items: center; justify-content: center; font-size: 11px;\">{{ t.glyph }}<\u002Fspan>\n                      <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;\">\n                        <div style=\"display: flex; align-items: center; gap: 8px;\">\n                          <span style=\"font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #e4e4e9;\">{{ t.name }}<\u002Fspan>\n                          <span style=\"font-size: 12.5px; color: #a6a6ad;\">{{ t.desc }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ t.note }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"font-size: 11px; color: #a08a6b; line-height: 1.6;\">{{ t.note }}<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"flex: none; display: flex; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.05); gap: 2px;\">\n                        <sc-for list=\"{{ t.perms }}\" as=\"p\" hint-placeholder-count=\"3\">\n                          <button sc-camel-on-click=\"{{ p.pick }}\" style=\"padding: 4px 10px; border-radius: 6px; border: none; font-size: 11.5px; cursor: pointer; background: {{ p.bg }}; color: {{ p.fg }}; transition: background .15s;\" style-hover=\"filter: brightness(1.3)\">{{ p.label }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 10px; background: rgba(127,167,212,.05);\">\n                    <span style=\"font-size: 12px; color: #8ba7c4; line-height: 1.65; flex: 1;\">连接器提供的工具不在这里——它们跟着所属服务走，在「连接器」页按服务开关。<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ goMcp }}\" style=\"flex: none; padding: 5px 10px; border-radius: 7px; border: none; background: rgba(255,255,255,.07); color: #cfe0f2; font-size: 11.5px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.13)\">去连接器<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 11.5px; color: #63636b; line-height: 1.8; padding: 2px 2px;\">「询问」= 执行前弹权限确认卡片 ">{{ c.toolCount }}<\u002Fspan>\n                        <sc-for list=\"{{ c.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n                          <button style=\"flex: none; padding: 4px 9px; border-radius: 6px; border: none; background: rgba(255,255,255,.06); color: #b6b6be; font-size: 11px; cursor: pointer;\" style-hover=\"background: rgba(255,255,255,.12)\">{{ a.label }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                        <span style=\"width: 30px; height: 17px; flex: none; border-radius: 10px; background: {{ c.trackBg }}; position: relative;\">\n                          <span style=\"position: absolute; top: 2px; left: {{ c.knobX }}; width: 13px; height: 13px; border-radius: 50%; background: #fff;\"><\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ c.err }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"margin: 0 13px 10px 34px; padding: 9px 11px; border-radius: 8px; background: rgba(201,99,91,.09); font-size: 11.5px; color: #dfa39d; line-height: 1.6;\">{{ c.err }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"padding: 0 13px 11px 34px; display: flex; flex-direction: column; gap: 2px;\">\n                          <div style=\"font-size: 11px; letter-spacing: .06em; color: #6d6d75; padding: 2px 0 5px;\">该服务提供的工具<\u002Fdiv>\n                          <sc-for list=\"{{ c.tools }}\" as=\"t\" hint-placeholder-count=\"2\">\n                            <div style=\"display: flex; align-items: center; gap: 11px; padding: 8px 9px; border-radius: 8px; background: rgba(255,255,255,.02);\">\n                              <span style=\"font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: {{ t.nameFg }}; flex: none;\">{{ t.name }}<\u002Fspan>\n                              <span style=\"font-size: 12px; color: #8a8a92; flex: 1; min-width: 0;\">{{ t.desc }}<\u002Fspan>\n                              <div style=\"flex: none; display: flex; padding: 2px; border-radius: 7px; background: rgba(255,255,255,.05); gap: 2px;\">\n                                <sc-for list=\"{{ t.perms }}\" as=\"p\" hint-placeholder-count=\"3\">\n                                  <button sc-camel-on-click=\"{{ p.pick }}\" style=\"padding: 3px 9px; border-radius: 5px; border: none; font-size: 11px; cursor: pointer; background: {{ p.bg }}; color: {{ p.fg }};\" style-hover=\"filter: brightness(1.3)\">{{ p.label }}<\u002Fbutton>\n                                <\u002Fsc-for>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"font-size: 11.5px; color: #63636b; line-height: 1.8; padding: 2px 2px;\">关掉整个服务 = 它的工具全部从 Agent 的可用列表里消失；单条工具的「禁止」只挡这一个方法。未连接的服务保留配置，不占用可用列表。<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <!-- 权限规则 -->\n              <sc-if value=\"{{ isRules }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                  <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 13px; border-radius: 10px; background: #17171a;\">\n                    <div style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n                      <span style=\"font-size: 12.5px; color: #e4e4e9;\">新会话的默认模式<\u002Fspan>\n                      <span style=\"font-size: 11px; color: #75757e;\">会话里可以随时用 ⇧⌘P 临时改，不写回这里<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex: none; display: flex; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.05); gap: 式', '完全访问'].map(label => ({\n      label, bg: st.mode === label ? 'rgba(127,167,212,.18)' : 'transparent', fg: st.mode === label ? '#9dbfe0' : '#8a8a92',\n      pick: () => this.s({ mode: label })\n    }));\n\n    const ruleGroups = [\n      { title: '本工作区 · ' + curWs.name, note: '换工作区自动失效', items: [\n        { tool: 'read', match: '路径', pattern: '~/work/risk-q2/**', meta: '7-24 创建 · 命中 142 次' },\n        { tool: 'write', match: '路径', pattern: '~/work/risk-q2/reports/**', meta: '今天 · 命中 3 次' },\n        { tool: 'bash', match: '命令前缀', pattern: 'git status', meta: '7-24 · 命中 8 次' }\n      ] },\n      { title: '全局', note: '所有工作区生效', items: [\n        { tool: 'web_search', match: '工具级', pattern: '任意查询', meta: '7-18 · 命中 61 次' }\n      ] },\n      { title: '本会话 · Q2 交易异常分析', note: '会话结束即失效', items: [\n        { tool: 'postgres.query', match: '连接器方法', pattern: 'prod-read · select 语句', meta: '14:06 · 命中 2 次' }\n      ] }\n    ];\n    const blacklist = ['rm', 'sudo', 'chmod 777', '> /', 'curl … | sh', 'git push --force'].map(label => ({ label }));\n\n    const modelDefs = [\n      { id: 'sonnet', name: 'Claude Sonnet 4.5', window: '168K', desc: '默认。工具调用稳定，长任务性价比最好。', tag: '推荐' },\n      { id: 'opus', name: 'Claude Opus 4.1', window: '200K', desc: '复杂推理更强，慢一档、贵一档。适合做计划和最终审阅。' },\n      { id: 'local', name: '本地 Qwen 32B', window: '32K', desc: '完全离线。工具调用较弱，建议只用于摘要压缩和子智能体。' }\n    ];\n    const models = modelDefs.map(m => ({\n      name: m.name, window: m.window, desc: m.desc, tag: m.tag,\n      bg: st.primary === m.id ? 'rgba(127,167,212,.07)' : '#17171a',\n      ring: st.primary === m.id ? 'rgba(127,167,212,.28)' : 'rgba(255,255,255,.04)',\n      dot: st.primary === m.id ? '#9dbfe0' : 'transparent',\n      dotRing: st.primary === m.id ? '#9dbfe0' : 'rgba(255,255,255,.22)',\n      pick: () => this.s({ primary: m.id })\n    }));\n    const roleOpts = (key) => [['follow', '跟随主模型'], ['sonnet', 'Sonnet 4.5'], ['local', '本地 Qwen']].map(([id, label]) => ({\n      label, bg: st[key] === id ? 'rgba(127,167,212,.18)' : 'transparent', fg: st[key] === id ? '#9dbfe0' : '#8a8a92',\n      pick: () => this.s({ [key]: id })\n    }));\n    const roleRows = [\n      { label: '子智能体', desc: '派出去做清洗、检索这类子任务的模型', opts: roleOpts('subModel') },\n      { label: '上下文压缩', desc: '生成历史摘要的模型。用小模型更快，摘要质量够用', opts: roleOpts('sumModel') }\n    ];\n    const keyRows = [\n      { label: 'Anthropic API Key', value: 'sk-ant-••••••••••••4f2a', dot: '#8fc6a5', action: '更换' },\n      { label: '本地模型端点', value: 'http://127.0.0.1:11434', dot: '#8fc6a5', action: '测试连接' },\n      { label: 'OpenAI 兼容端点', value: '未配置', dot: '#55555c', action: '添加' }\n    ];\n\n    const tabMeta = {\n      tools: { title: '工具', sub: '每个工具三档权限：允许直接用、执行前询问、完全禁止。默认只有读类工具是「允许」。', action: null },\n      rules: { title: '权限规则', sub: '这里是「总是允许」攒出来的规则库。每条规则都能看到范围、创建时间和命中次数，随时撤销。', action: '+ 手动添加规则' },\n      model: { title: '模型与密钥', sub: '主模型、子智能体和压缩摘要可以用不同模型；密钥只存在本机钥匙串。', action: null },\n      mcp: { title: '连接器（MCP）', sub: '每个服务一张卡：连接状态、启动命令、它提供的工具。服务关掉，它的工具就从 Agent 的可用列表里消失。', action: '+ 添加连接器' },\n      skills: { title: '技能', sub: '技能是说明书 + 可选脚本，Agent 判断需要时才读进来。按来源分组，工作区技能随工作区切换。', action: '+ 添加技能' }\n    }[tab];\n\n    const decisions = [\n      { tag: '决定 · 2', tagFg: '#e5c49d', tagBg: 'rgba(224,163,62,.14)', q: '工具卡片四态与折叠策略', a: '等待授权优先于执行中——事件到达顺序由 UI 层重排：收到 tool_start 后延迟 120ms 再进入「执行中」，若期间收到授权请求则直接落在「等待授权」。', why: '底层 tool_start 比授权请求早约 5ms。若照事件顺序渲染，用户会先看到「正在执行 rm -rf」，信任一次就崩。折叠策略：成功折成一行，等待授权/失败默认展开，执行中展开尾部输出、完成后自动收起。', code: 'if (evt === \"tool_start\") queue(120ms → running)\\nif (evt === \"permission_request\") cancelQueue(); status = \"pending\"' },\n      { tag: '决定 · 3', tagFg: '#e5a49d', tagBg: 'rgba(201,99,91,.14)', q: '「总是允许」的粒度', a: '组合粒度：工具 × 匹配范围 × 有效期。范围随工具类别变——文件类用路径 glob，命令类用命令前缀，连接器用「服务.方法」。默认有效期是「本项目」。', why: '单一粒度必错：按工具太粗（一次点击交出 shell），按参数太细（每个新文件都要重问）。破坏性命令（rm / sudo / 重定向 / 管道到 sh）设为不可持久化——这类操作的价值在于每次都停一下。', code: 'PermissionRule {\\n  tool: \"bash\" | \"read\" | \"postgres.query\" | …\\n  match: \"tool\" | \"path\" | \"prefix\" | \"method\"\\n  pattern: string          // \"~/project/**\" | \"git status\"\\n  scope: \"session\" | \"project\" | \"global\"\\n  neverPersist: boolean    // rm/sudo/重定向 命中即 true\\n}' },\n      { tag: '决定 · 3', tagFg: '#e5a49d', tagBg: 'rgba(201,99,91,.14)', q: 'inline 还是模态', a: 'inline 为默认，「高危 + 不可逆」升级为模态。inline 卡片配一条底部常驻的「1 个授权请求等待处理」跳转条，解决被划过去的问题。', why: 'Agent 会话里授权很频繁，模态会把心流切碎；但不可逆操作必须强制响应。用危险等级而不是用工具名做升级判据，规则简单且可解释。' },\n      { tag: '决定 · 5', tagFg: '#a9c4de', tagBg: 'rgba(127,167,212,.14)', q: '会话要不要分支 / 时间旅行', a: '不需要。存储保持一条 append-only 线性日志，不建树。', why: '理由三条：① Agent 任务是目标导向的，用户要「重来一次」而不是「保留两条路对比」；② 树形历史的成本全在 UI 与心智模型上——一旦有分支就要有分支切换器、diff、合并语义，而用户真正用到的只有「回到那一步」；③ 替代方案更便宜：「编辑并重发」= 截断后面的消息（软删除、可撤销），「以此为起点新建会话」= 把上下文摘要复制进新会话，两个会话之间只记一个 origin 指针，扁平不成树。', code: 'Session { id, messages: Message[] }   // 线性\\nMessage { id, truncatedAt?, supersededBy? }\\nSession.originRef?: { sessionId, messageId }  // 扁平引用，非树' },\n      { tag: '决定 · 4', tagFg: '#a9c4de', tagBg: 'rgba(127,167,212,.14)', q: '压缩自动还是手动', a: '自动（85% 阈值）+ 手动可提前。触发前给 3 秒「稍后」窗口；进行中在对话流插一条带进度的占位，输入框不锁死，消息排队发送。', why: '压缩要调一次模型、有几秒延迟，若让用户确认就等于在任务中途打断他。留「稍后」是为了不在关键一步前动上下文。被压缩的消息在界面上留一条可展开分隔线——彻底消失会让用户怀疑数据丢了。' },\n      { tag: '决定 · 1', tagFg: '#a9c4de', tagBg: 'rgba(127,167,212,.14)', q: '结果区如何组织', a: '时间倒序 + 类型筛选（不按类型分组），本次任务与更早两段。预览只读，改动一律回到对话：「让 Agent 改这份」。', why: '同一次任务的产物通常一起被查看，按类型分组会把它们拆散。只读避免「用户手改」和「Agent 再写」打架出现两份真相；真要手改就走「打开」交给外部编辑器。' },\n      { tag: '决定 · 2.5', tagFg: '#c3b6e8', tagBg: 'rgba(176,162,224,.14)', q: '系统标记的统一语言', a: '一行 12px 次要色 + 18px 圆角字形徽标 + 向右淡出的细线；有细节的（压缩、切换专家）可展开，纯事实的（模式变更、重试）不可展开。', why: '标记不是对话内容，所以不用气泡、不占对话缩进；但要能被扫到，所以用一条贯穿的淡线把它和消息区分开。字形而不是彩色图标，避免和工具卡片的状态色抢注意力。' }\n    ];\n\n    return {\n      scenes, sceneNote: notes[sc], flow,\n      scrollRef: this.scroller, jumpToPending: () => this.scrollTo('pending'),\n      threadTitle: noSessions ? '新会话' : 'Q2 交易异常分析',\n      threadRunning: !noSessions && sc !== 'empty',\n      showWelcome: noSessions,\n      examples: [\n        { kind: '数据', text: '把 data/ 下的 CSV 清洗合并，输出一张异常账户表' },\n        { kind: '代码', text: '给 src/api 补上错误处理，跑一遍测试' },\n        { kind: '调研', text: '比对这 12 份合同的赔付条款，列出差异' }\n      ],\n      workspaces: wsList, wsName: curWs.name, wsPath: curWs.path,\n      wsOpen: st.wsOpen, wsChipBg: st.wsOpen ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.04)',\n      toggleWs: () => this.s({ wsOpen: !st.wsOpen, ctxMenu: false, menu: null }),\n      hasSessions: !noSessions, noSessions, sessionGroups, query: st.query, onQuery: e => this.s({ query: e.target.value }),\n      ctxMenu: st.ctxMenu,\n      ctxMenuItems: [\n        { label: '置顶', key: '', color: '#e2e2e7' }, { label: '重命名', key: 'F2', color: '#e2e2e7' },\n        { label: '以此为起点新建会话', key: '', color: '#e2e2e7' }, { label: '导出会话与产物', key: '', color: '#e2e2e7' },\n        { label: '归档', key: '', color: '#e2e2e7' }, { label: '删除', key: '⌫', color: '#dfa39d' }\n      ],\n      resultsOpen: st.resultsOpen, toggleResults: () => this.s({ resultsOpen: !st.resultsOpen }),\n      hasResults: !noSessions, noResults: noSessions,\n      resultCount: shown.length + ' 个产物',\n      filters: ['全部', '文档', '代码', '图片', '数据'].map(label => ({ label, bg: st.filter === label ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.04)', fg: st.filter === label ? '#f0f0f3' : '#8a8a92', pick: () => this.s({ filter: label }) })),\n      resultGroups, preview,\n      emptyHints: [\n        { ext: 'MD', label: '报告与文档', desc: 'Agent 写出的 markdown、渲染后阅读' },\n        { ext: 'PY', label: '被改动的代码', desc: '带 diff，可跳到编辑器' },\n        { ext: 'PNG', label: '图表与截图', desc: '点开放大' },\n        { ext: 'CSV', label: '数据与导出', desc: '前 100 行预览' }\n      ],\n      showQueue: (sc === 'perm' || sc === 'main') && st.dangerStatus === 'pending',\n      entryChips, model: 'Sonnet 4.5', openModel: () => this.s({ menu: st.menu === 'model' ? null : 'model' }),\n      menuOpen: !!mk, menuTitle: mk ? mk.title : '', menuHint: mk ? mk.hint : '', menuX: mk ? mk.x : '0px',\n      menuItems: mk ? mk.items.map(i => Object.assign({}, i, { bg: 'transparent', tokens: i.tokens || '', pick: () => this.s({ menu: null, mode: mk === menus.mode ? i.label : st.mode }) })) : [],\n      draft: st.draft, onDraft: e => this.s({ draft: e.target.value }),\n      modeHint: st.mode === '完全访问' ? '完全访问：不会再询问授权' : (st.mode === '计划模式' ? '计划模式：写操作先出计划' : '默认权限：写操作与命令会请求授权'),\n      ctxPct: '43.1%', ctxChipBg: 'rgba(224,163,62,.10)',\n      contextOpen: st.contextOpen, toggleContext: () => this.s({ contextOpen: !st.contextOpen, menu: null }),\n      ctxRows, startCompress: this.startCompress, cancelCompress: () => this.s({ compress: 'idle' }),\n      alwaysOpen: st.alwaysOpen, toggleAlways: () => this.s({ alwaysOpen: !st.alwaysOpen, denyOpen: false }),\n      grains, scopes, grainWarning,\n      denyOpen: st.denyOpen, toggleDeny: () => this.s({ denyOpen: !st.denyOpen, alwaysOpen: false }),\n      denyReason: st.denyReason, onDenyReason: e => this.s({ denyReason: e.target.value }), denyPresets, denySend: this.deny,\n      allowOnce: this.allow, allowAlways: this.allow, replay: this.replay,\n      permModal: st.permModal, openPermModal: () => this.s({ permModal: true }), closePermModal: () => this.s({ permModal: false }),\n      settingsOpen: st.settingsOpen, openSettings: () => this.s({ settingsOpen: true, menu: null, contextOpen: false }), closeSettings: () => this.s({ settingsOpen: false, lastNote: '' }),\n      settingsNav: [['general', '通用'], ['model', '模型与密钥'], ['rules', '权限规则'], ['tools', '工具'], ['mcp', '连接器（MCP）'], ['skills', '技能'], ['appearance', '外观']].map(([id, label]) => ({\n        label, pick: () => this.s({ settingsTab: id === 'general' || id === 'appearance' ? tab : id }),\n        fg: id === tab ? '#f0f0f3' : '#9a9aa2', bg: id === tab ? 'rgba(255,255,255,.07)' : 'transparent',\n        badge: id === 'mcp' ? '1 异常' : (id === 'tools' ? askCount + ' 询问' : null),\n        badgeBg: id === 'mcp' ? 'rgba(201,99,91,.16)' : 'rgba(224,163,62,.14)',\n        badgeFg: id === 'mcp' ? '#dfa39d' : '#e0c39e'\n      })),\n      isTools: tab === 'tools', isMcp: tab === 'mcp', isSkills: tab === 'skills', isRules: tab === 'rules', isModel: tab === 'model',\n      modeSeg, ruleGroups, blacklist, models, roleRows, keyRows,\n      setTitle: tabMeta.title, setSub: tabMeta.sub, setAction: tabMeta.action,\n      toolCount: '(' + builtinTools.length + ')', builtinTools, bulkPerms, connectors, skillGroups,\n      goMcp: () => this.s({ settingsTab: 'mcp' }),\n      decisionsOpen: st.decisionsOpen, toggleDecisions: () => this.s({ decisionsOpen: !st.decisionsOpen }),\n      decisions\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
